<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shing Live - Stream Timer Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Nunito', system-ui, -apple-system, sans-serif;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #timer-card {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    width: fit-content;
    max-width: max-content;
    white-space: nowrap;
    transform: scale(var(--timer-scale, 1.0));
    transform-origin: center center;
    background: var(--theme-bg, linear-gradient(160deg, rgba(24, 20, 40, 0.92) 0%, rgba(16, 14, 28, 0.96) 100%));
    border: 2px solid var(--theme-border, rgba(187, 134, 252, 0.5));
    border-radius: 32px;
    padding: 12px 28px;
    box-shadow: var(--theme-shadow, 0 10px 28px rgba(0, 0, 0, 0.45), 0 0 18px rgba(187, 134, 252, 0.25));
    backdrop-filter: blur(12px);
    color: var(--theme-text, #fff);
    position: relative;
    transition: border-color 0.4s, box-shadow 0.4s, transform 0.2s ease;
  }

  /* 6 Plain Color Themes */
  #timer-card,
  #timer-card[data-theme="Purple"] {
    --theme-bg: linear-gradient(160deg, rgba(24, 20, 40, 0.94) 0%, rgba(16, 14, 28, 0.98) 100%);
    --theme-border: rgba(187, 134, 252, 0.55);
    --theme-accent: #c084fc;
    --theme-digits: #ffffff;
    --theme-digits-glow: rgba(192, 132, 252, 0.45);
    --theme-shadow: 0 10px 28px rgba(0, 0, 0, 0.45), 0 0 20px rgba(187, 134, 252, 0.25);
    --theme-text: #fff;
  }
  #timer-card[data-theme="Pink"] {
    --theme-bg: linear-gradient(160deg, rgba(38, 20, 36, 0.94) 0%, rgba(26, 13, 25, 0.98) 100%);
    --theme-border: rgba(255, 126, 185, 0.55);
    --theme-accent: #ff7eb9;
    --theme-digits: #ffffff;
    --theme-digits-glow: rgba(255, 126, 185, 0.45);
    --theme-shadow: 0 10px 28px rgba(0, 0, 0, 0.45), 0 0 20px rgba(255, 126, 185, 0.25);
    --theme-text: #fff;
  }
  #timer-card[data-theme="Blue"] {
    --theme-bg: linear-gradient(160deg, rgba(16, 26, 46, 0.94) 0%, rgba(10, 18, 33, 0.98) 100%);
    --theme-border: rgba(72, 181, 255, 0.55);
    --theme-accent: #48b5ff;
    --theme-digits: #ffffff;
    --theme-digits-glow: rgba(72, 181, 255, 0.45);
    --theme-shadow: 0 10px 28px rgba(0, 0, 0, 0.45), 0 0 20px rgba(72, 181, 255, 0.25);
    --theme-text: #fff;
  }
  #timer-card[data-theme="Green"] {
    --theme-bg: linear-gradient(160deg, rgba(16, 36, 26, 0.94) 0%, rgba(10, 24, 18, 0.98) 100%);
    --theme-border: rgba(52, 211, 153, 0.55);
    --theme-accent: #34d399;
    --theme-digits: #ffffff;
    --theme-digits-glow: rgba(52, 211, 153, 0.45);
    --theme-shadow: 0 10px 28px rgba(0, 0, 0, 0.45), 0 0 20px rgba(52, 211, 153, 0.25);
    --theme-text: #fff;
  }
  #timer-card[data-theme="Dark"] {
    --theme-bg: linear-gradient(160deg, rgba(22, 22, 26, 0.95) 0%, rgba(14, 14, 18, 0.98) 100%);
    --theme-border: rgba(255, 255, 255, 0.22);
    --theme-accent: #e2e8f0;
    --theme-digits: #ffffff;
    --theme-digits-glow: rgba(255, 255, 255, 0.25);
    --theme-shadow: 0 10px 28px rgba(0, 0, 0, 0.6);
    --theme-text: #fff;
  }
  #timer-card[data-theme="Light"] {
    --theme-bg: linear-gradient(160deg, rgba(255, 255, 255, 0.96) 0%, rgba(245, 243, 255, 0.96) 100%);
    --theme-border: rgba(123, 63, 228, 0.45);
    --theme-accent: #7b3fe4;
    --theme-digits: #271442;
    --theme-digits-glow: rgba(123, 63, 228, 0.15);
    --theme-shadow: 0 10px 28px rgba(123, 63, 228, 0.25);
    --theme-text: #271442;
  }

  /* Low Time Warning Pulse (< 5 mins) */
  #timer-card.low-time {
    border-color: #f43f5e;
    animation: urgentPulse 1.4s ease infinite;
  }
  @keyframes urgentPulse {
    0% { box-shadow: 0 0 12px rgba(244, 63, 94, 0.35); }
    50% { box-shadow: 0 0 24px rgba(244, 63, 94, 0.65); }
    100% { box-shadow: 0 0 12px rgba(244, 63, 94, 0.35); }
  }

  .icon-wrap {
    color: var(--theme-accent, #c084fc);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #timer-card.low-time .icon-wrap {
    color: #f43f5e;
  }

  #time-display {
    font-size: 38px;
    font-weight: 900;
    color: var(--theme-digits, #fff);
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
    text-shadow: 0 0 16px var(--theme-digits-glow, rgba(192, 132, 252, 0.4));
  }
  #timer-card.low-time #time-display {
    color: #f43f5e;
    text-shadow: 0 0 16px rgba(244, 63, 94, 0.4);
  }

  /* Floating Bonus Seconds Tags */
  .bonus-tag {
    position: absolute;
    top: -14px;
    right: 20px;
    background: #ec4899;
    color: #fff;
    font-size: 14px;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(236, 72, 153, 0.4);
    pointer-events: none;
    animation: bonusFloat 1.2s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
  }
  @keyframes bonusFloat {
    0% { transform: translateY(0) scale(0.8); opacity: 0; }
    30% { transform: translateY(-16px) scale(1.15); opacity: 1; }
    80% { transform: translateY(-34px) scale(1); opacity: 1; }
    100% { transform: translateY(-44px) scale(0.9); opacity: 0; }
  }

  /* Floating Deduct Seconds Tags */
  .deduct-tag {
    position: absolute;
    top: -14px;
    right: 20px;
    background: #f43f5e;
    color: #fff;
    font-size: 14px;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(244, 63, 94, 0.4);
    pointer-events: none;
    animation: deductFloat 1.2s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
  }
  @keyframes deductFloat {
    0% { transform: translateY(0) scale(0.8); opacity: 0; }
    30% { transform: translateY(-16px) scale(1.15); opacity: 1; }
    80% { transform: translateY(-34px) scale(1); opacity: 1; }
    100% { transform: translateY(-44px) scale(0.9); opacity: 0; }
  }
</style>
</head>
<body>
<div id="timer-card">
  <div class="icon-wrap">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
    </svg>
  </div>
  <div id="time-display">00:30:00</div>
</div>

<script>
'use strict';

const timerCard = document.getElementById('timer-card');
const display = document.getElementById('time-display');
let remainingSeconds = 1800;
let isRunning = false;
let timerInterval = null;
let timerSettings = {
  durationMin: 30,
  addSecondsPerGift: 15,
  reduceSecondsPerComment: 1,
  reduceSecondsPerLike: 0.1,
  theme: 'Purple',
  scale: 1.0
};

function applyTheme(theme) {
  const allowed = ['Purple', 'Pink', 'Blue', 'Green', 'Dark', 'Light'];
  const safeTheme = allowed.includes(theme) ? theme : 'Purple';
  timerCard.setAttribute('data-theme', safeTheme);
}

function applyScale(scale) {
  const s = Math.max(0.4, Math.min(2.0, Number(scale) || 1.0));
  timerCard.style.setProperty('--timer-scale', s);
}

function formatTime(sec) {
  const safeSec = Math.max(0, Number(sec) || 0);
  const h = Math.floor(safeSec / 3600);
  const m = Math.floor((safeSec % 3600) / 60);
  const s = safeSec % 60;
  if (h > 0) {
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function updateDisplay() {
  display.textContent = formatTime(remainingSeconds);
  if (remainingSeconds > 0 && remainingSeconds <= 300) {
    timerCard.classList.add('low-time');
  } else {
    timerCard.classList.remove('low-time');
  }
}

function spawnBonusTag(seconds) {
  const tag = document.createElement('div');
  tag.className = 'bonus-tag';
  tag.textContent = `+${seconds}s`;
  timerCard.appendChild(tag);
  setTimeout(() => tag.remove(), 1250);
}

function spawnDeductTag(seconds) {
  const tag = document.createElement('div');
  tag.className = 'deduct-tag';
  tag.textContent = `-${seconds}s`;
  timerCard.appendChild(tag);
  setTimeout(() => tag.remove(), 1250);
}

function startTimer() {
  if (isRunning) return;
  isRunning = true;
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (remainingSeconds > 0) {
      remainingSeconds--;
      updateDisplay();
    } else {
      pauseTimer();
    }
  }, 1000);
}

function pauseTimer() {
  isRunning = false;
  clearInterval(timerInterval);
}

function resetTimer(seconds) {
  remainingSeconds = (seconds !== undefined && seconds !== null) ? seconds : (timerSettings.durationMin * 60);
  updateDisplay();
}

function addTime(seconds) {
  remainingSeconds += seconds;
  updateDisplay();
  spawnBonusTag(seconds);
}

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${proto}//${location.host}`);

  ws.onmessage = evt => {
    try {
      const data = JSON.parse(evt.data);
      if (data.type === 'init') {
        if (data.settings?.timer) {
          timerSettings = Object.assign(timerSettings, data.settings.timer);
          if (timerSettings.theme) applyTheme(timerSettings.theme);
          if (timerSettings.scale) applyScale(timerSettings.scale);
        }
        if (data.timer) {
          remainingSeconds = data.timer.remainingSeconds;
          isRunning = data.timer.isRunning;
          if (data.timer.theme) applyTheme(data.timer.theme);
          if (data.timer.scale) applyScale(data.timer.scale);
          updateDisplay();
        }
      } else if (data.type === 'settings:update' && data.settings?.timer) {
        timerSettings = Object.assign(timerSettings, data.settings.timer);
        if (timerSettings.theme) applyTheme(timerSettings.theme);
        if (timerSettings.scale) applyScale(timerSettings.scale);
      } else if (data.type === 'timer:tick') {
        remainingSeconds = data.remainingSeconds;
        updateDisplay();
      } else if (data.type === 'timer:sync') {
        if (data.timer) {
          remainingSeconds = data.timer.remainingSeconds;
          isRunning = data.timer.isRunning;
          if (data.timer.theme) applyTheme(data.timer.theme);
          if (data.timer.scale) applyScale(data.timer.scale);
          updateDisplay();
        }
      } else if (data.type === 'timer:deduct') {
        remainingSeconds = data.remainingSeconds;
        updateDisplay();
        spawnDeductTag(data.seconds);
      } else if (data.type === 'timer:bonus') {
        remainingSeconds = data.remainingSeconds;
        updateDisplay();
        spawnBonusTag(data.seconds);
      } else if (data.type === 'timer:control') {
        if (data.action === 'start') startTimer();
        else if (data.action === 'pause') pauseTimer();
        else if (data.action === 'reset') resetTimer(data.seconds);
        else if (data.action === 'add') addTime(data.seconds || 60);
      }
    } catch (e) {
      console.warn('Timer WS error', e);
    }
  };

  ws.onclose = () => setTimeout(connectWS, 2000);
  ws.onerror = () => ws.close();
}

connectWS();
updateDisplay();
</script>
</body>
</html>
