<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shing Live - Animated Streamer Info Banner Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Fredoka:wght@600;700&family=Press+Start+2P&display=swap">
<style>
  :root {
    --banner-scale: 1.0;
    --banner-width: 820px;
    --banner-aspect-ratio: 3 / 1;
    --theme-primary: #c084fc;
    --theme-secondary: #f472b6;
    --theme-accent: #38bdf8;
    --theme-bg-gradient: linear-gradient(135deg, rgba(28, 22, 54, 0.94) 0%, rgba(18, 14, 36, 0.98) 50%, rgba(38, 20, 60, 0.94) 100%);
    --theme-border: rgba(192, 132, 252, 0.45);
    --theme-glow: 0 10px 32px rgba(0, 0, 0, 0.55), 0 0 24px rgba(192, 132, 252, 0.25);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
    user-select: none;
  }

  #banner-stage {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  #streamer-banner-container {
    position: fixed;
    top: 50%;
    left: 50%;
    width: var(--banner-width, 820px);
    aspect-ratio: var(--banner-aspect-ratio, 3 / 1);
    transform: translate(-50%, -50%) scale(var(--banner-scale, 1));
    transform-origin: center center;
    will-change: transform;
    pointer-events: none;
  }

  /* Aspect Ratio Configurations */
  #streamer-banner-container[data-ratio="3:1"] {
    --banner-width: 820px;
    --banner-aspect-ratio: 3 / 1;
  }

  #streamer-banner-container[data-ratio="16:9"] {
    --banner-width: 780px;
    --banner-aspect-ratio: 16 / 9;
  }

  #streamer-banner-container[data-ratio="4:1"] {
    --banner-width: 860px;
    --banner-aspect-ratio: 4 / 1;
  }

  #streamer-banner-container[data-ratio="1:1"] {
    --banner-width: 360px;
    --banner-aspect-ratio: 1 / 1;
    aspect-ratio: 1 / 1;
  }

  /* Decorative upper topper container */
  #banner-topper {
    position: absolute;
    top: -42px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    pointer-events: none;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    transition: opacity 0.2s ease;
  }

  #banner-topper[data-topper="none"],
  #banner-topper.hidden {
    display: none !important;
  }

  .topper-svg {
    display: none;
  }

  #banner-topper[data-topper="bear"] #topper-bear {
    display: block;
  }

  #banner-topper[data-topper="ribbon"] #topper-ribbon {
    display: block;
  }

  #banner-topper[data-topper="cat"] #topper-cat {
    display: block;
  }

  #banner-topper[data-topper="wings"] #topper-wings {
    display: block;
  }

  /* Main Creavite-style horizontal card */
  #banner-card {
    width: 100%;
    height: 100%;
    position: relative;
    border-radius: 22px;
    background: var(--theme-bg-gradient);
    border: 2px solid var(--theme-border);
    box-shadow: var(--theme-glow);
    backdrop-filter: blur(16px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 16px 22px 12px;
    color: #ffffff;
    overflow: hidden;
  }

  /* Particle Canvas Overlay */
  #banner-particle-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 2;
  }

  /* Glossy Shine Sweep Effect */
  #banner-shine-overlay {
    position: absolute;
    top: 0;
    left: -160%;
    width: 80%;
    height: 100%;
    background: linear-gradient(105deg, transparent 20%, rgba(255, 255, 255, 0.16) 45%, rgba(255, 255, 255, 0.24) 50%, rgba(255, 255, 255, 0.16) 55%, transparent 80%);
    transform: skewX(-22deg);
    animation: shineSweep 5s infinite ease-in-out;
    pointer-events: none;
    z-index: 5;
  }

  #banner-shine-overlay.hidden {
    display: none !important;
  }

  @keyframes shineSweep {
    0% {
      left: -160%;
    }
    40%, 100% {
      left: 200%;
    }
  }

  /* Cute Templates Theming */
  /* 1. Pastel Dream */
  #banner-card.theme-pastel-dream {
    --theme-primary: #c084fc;
    --theme-secondary: #f472b6;
    --theme-accent: #38bdf8;
    --theme-bg-gradient: linear-gradient(135deg, rgba(28, 20, 52, 0.94) 0%, rgba(18, 14, 36, 0.98) 50%, rgba(42, 22, 64, 0.94) 100%);
    --theme-border: rgba(192, 132, 252, 0.5);
    --theme-glow: 0 10px 32px rgba(0, 0, 0, 0.55), 0 0 24px rgba(192, 132, 252, 0.28);
  }

  /* 2. Cozy Cat Cafe */
  #banner-card.theme-cozy-cat {
    --theme-primary: #fb923c;
    --theme-secondary: #fcd34d;
    --theme-accent: #fed7aa;
    --theme-bg-gradient: linear-gradient(135deg, rgba(46, 30, 20, 0.95) 0%, rgba(30, 18, 12, 0.98) 50%, rgba(54, 34, 24, 0.95) 100%);
    --theme-border: rgba(251, 146, 60, 0.52);
    --theme-glow: 0 10px 32px rgba(0, 0, 0, 0.6), 0 0 24px rgba(251, 146, 60, 0.28);
  }

  /* 3. Magical Sparkle Ribbon */
  #banner-card.theme-magical-ribbon {
    --theme-primary: #ec4899;
    --theme-secondary: #fbbf24;
    --theme-accent: #a855f7;
    --theme-bg-gradient: linear-gradient(135deg, rgba(48, 16, 40, 0.95) 0%, rgba(32, 12, 30, 0.98) 50%, rgba(68, 18, 54, 0.95) 100%);
    --theme-border: rgba(236, 72, 153, 0.55);
    --theme-glow: 0 10px 32px rgba(0, 0, 0, 0.6), 0 0 26px rgba(236, 72, 153, 0.32);
  }

  /* 4. Chibi Pixel Arcade */
  #banner-card.theme-pixel-arcade {
    --theme-primary: #06b6d4;
    --theme-secondary: #f43f5e;
    --theme-accent: #8b5cf6;
    --theme-bg-gradient: linear-gradient(135deg, rgba(14, 20, 42, 0.96) 0%, rgba(10, 14, 28, 0.98) 50%, rgba(22, 28, 58, 0.96) 100%);
    --theme-border: rgba(6, 182, 212, 0.6);
    --theme-glow: 0 10px 32px rgba(0, 0, 0, 0.65), 0 0 28px rgba(6, 182, 212, 0.35);
  }

  /* 5. Sakura Blossom */
  #banner-card.theme-sakura-blossom {
    --theme-primary: #fb7185;
    --theme-secondary: #fda4af;
    --theme-accent: #fbcfe8;
    --theme-bg-gradient: linear-gradient(135deg, rgba(44, 18, 30, 0.95) 0%, rgba(28, 14, 22, 0.98) 50%, rgba(56, 22, 38, 0.95) 100%);
    --theme-border: rgba(251, 113, 133, 0.55);
    --theme-glow: 0 10px 32px rgba(0, 0, 0, 0.6), 0 0 26px rgba(251, 113, 133, 0.3);
  }

  /* Inner Layout */
  .banner-inner-layout {
    display: flex;
    align-items: center;
    gap: 20px;
    height: 100%;
    position: relative;
    z-index: 3;
  }

  /* Avatar Showcase Column */
  .banner-avatar-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .banner-avatar-wrap {
    width: 74px;
    height: 74px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(192, 132, 252, 0.22) 0%, rgba(24, 18, 42, 0.8) 100%);
    border: 2px solid var(--theme-primary);
    box-shadow: 0 0 16px var(--theme-border);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  #banner-avatar-canvas {
    width: 64px;
    height: 64px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .banner-avatar-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }

  .banner-live-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid var(--theme-primary);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
  }

  .live-pulse-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--theme-secondary);
    box-shadow: 0 0 6px var(--theme-secondary);
    animation: liveDotPulse 1.6s infinite ease-in-out;
  }

  @keyframes liveDotPulse {
    0%, 100% {
      transform: scale(1);
      opacity: 1;
    }
    50% {
      transform: scale(1.3);
      opacity: 0.5;
    }
  }

  .live-pill-text {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #ffffff;
  }

  /* Multi-Scene Stage Area */
  .banner-scenes-stage {
    flex: 1;
    height: 100%;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
  }

  .banner-scene {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    text-align: left;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.45s;
    pointer-events: none;
  }

  .banner-scene.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translate(0, 0) scale(1) rotateY(0deg);
  }

  /* Transition Styles */
  /* Slide Transition */
  .banner-scene.scene-slide {
    transform: translateX(40px);
  }
  .banner-scene.scene-slide.active {
    transform: translateX(0);
  }

  /* Fade Transition */
  .banner-scene.scene-fade {
    transform: none;
  }
  .banner-scene.scene-fade.active {
    transform: none;
  }

  /* Pop Transition */
  .banner-scene.scene-pop {
    transform: scale(0.92);
  }
  .banner-scene.scene-pop.active {
    transform: scale(1);
  }

  /* Flip Transition */
  .banner-scene.scene-flip {
    transform: perspective(600px) rotateX(30deg);
  }
  .banner-scene.scene-flip.active {
    transform: perspective(600px) rotateX(0deg);
  }

  /* Scene Badges & Headers */
  .scene-header-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
  }

  .badge-accent-line {
    width: 14px;
    height: 3px;
    border-radius: 2px;
    background: var(--theme-primary);
  }

  .badge-text {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--theme-secondary);
    text-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
  }

  /* Scene 1: Streamer Identity */
  .banner-name-text {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 0.6px;
    color: #ffffff;
    text-shadow: 0 2px 12px var(--theme-glow);
    line-height: 1.15;
    margin-bottom: 2px;
  }

  .banner-subtitle-text {
    font-size: 14px;
    font-weight: 700;
    color: var(--theme-accent);
    line-height: 1.25;
    margin-bottom: 6px;
  }

  .banner-divider {
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, var(--theme-primary), rgba(255, 255, 255, 0.15) 60%, transparent);
    margin-top: 2px;
  }

  /* Scene 2: Schedule & Bio */
  .banner-bio-text {
    font-size: 13px;
    line-height: 1.45;
    color: rgba(255, 255, 255, 0.9);
    font-weight: 600;
    max-height: 52px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 8px;
    word-break: break-word;
  }

  .banner-schedule-row {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 4px 12px;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid var(--theme-border);
  }

  .schedule-clock-icon {
    display: flex;
    align-items: center;
    color: var(--theme-primary);
  }

  .banner-schedule-text {
    font-size: 12px;
    font-weight: 700;
    color: #ffffff;
  }

  /* Scene 3: Socials Grid */
  .banner-socials-grid {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    width: 100%;
    margin-top: 4px;
  }

  .banner-social-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid var(--theme-border);
    color: #ffffff;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    max-width: 220px;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }

  .banner-social-badge svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    color: var(--theme-primary);
  }

  .banner-social-handle {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Bottom Footer: Scene Dots & Progress Bar */
  .banner-footer-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    margin-top: 6px;
    position: relative;
    z-index: 4;
  }

  .scene-dots-container {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .scene-dot {
    width: 8px;
    height: 8px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.25);
    border: none;
    padding: 0;
    cursor: pointer;
    transition: width 0.3s ease, background-color 0.3s ease;
  }

  .scene-dot.active {
    width: 22px;
    background: var(--theme-primary);
    box-shadow: 0 0 8px var(--theme-primary);
  }

  .scene-progress-track {
    flex: 1;
    height: 3px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.12);
    overflow: hidden;
  }

  .scene-progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, var(--theme-secondary), var(--theme-primary));
    border-radius: 2px;
    transition: width linear;
  }

  /* 5 Continuous motion animation keyframes */
  @keyframes float {
    0%, 100% {
      transform: translate(-50%, -50%) scale(var(--banner-scale, 1)) translateY(0px);
    }
    50% {
      transform: translate(-50%, -50%) scale(var(--banner-scale, 1)) translateY(-8px);
    }
  }

  @keyframes sway {
    0%, 100% {
      transform: translate(-50%, -50%) scale(var(--banner-scale, 1)) rotate(-1.5deg);
    }
    50% {
      transform: translate(-50%, -50%) scale(var(--banner-scale, 1)) rotate(1.5deg);
    }
  }

  @keyframes pulse {
    0%, 100% {
      transform: translate(-50%, -50%) scale(var(--banner-scale, 1));
      filter: drop-shadow(0 0 10px rgba(192, 132, 252, 0.3));
    }
    50% {
      transform: translate(-50%, -50%) scale(calc(var(--banner-scale, 1) * 1.025));
      filter: drop-shadow(0 0 20px rgba(192, 132, 252, 0.6));
    }
  }

  @keyframes breathe {
    0%, 100% {
      transform: translate(-50%, -50%) scale(var(--banner-scale, 1)) translateY(0px);
      opacity: 0.95;
    }
    50% {
      transform: translate(-50%, -50%) scale(calc(var(--banner-scale, 1) * 1.012)) translateY(-3px);
      opacity: 1;
    }
  }

  @keyframes bounce {
    0%, 100% {
      transform: translate(-50%, -50%) scale(var(--banner-scale, 1)) translateY(0px);
    }
    40% {
      transform: translate(-50%, -50%) scale(var(--banner-scale, 1)) translateY(-10px);
    }
    60% {
      transform: translate(-50%, -50%) scale(var(--banner-scale, 1)) translateY(2px);
    }
  }

  .anim-float {
    animation: float 4s ease-in-out infinite;
  }

  .anim-sway {
    animation: sway 5s ease-in-out infinite;
  }

  .anim-pulse {
    animation: pulse 3s ease-in-out infinite;
  }

  .anim-breathe {
    animation: breathe 4.5s ease-in-out infinite;
  }

  .anim-bounce {
    animation: bounce 2.8s ease-in-out infinite;
  }
</style>
</head>
<body>
<div id="banner-stage">
  <div id="streamer-banner-container" class="anim-float" data-animation="float" data-topper="bear" data-ratio="3:1">
    <div id="banner-topper" data-topper="bear">
      <!-- Bear Topper -->
      <svg id="topper-bear" class="topper-svg" viewBox="0 0 120 60" width="120" height="60" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="28" cy="22" r="14" fill="#a78bfa" stroke="#2e1a52" stroke-width="3"/>
        <circle cx="28" cy="22" r="7" fill="#fbcfe8"/>
        <circle cx="92" cy="22" r="14" fill="#a78bfa" stroke="#2e1a52" stroke-width="3"/>
        <circle cx="92" cy="22" r="7" fill="#fbcfe8"/>
        <ellipse cx="60" cy="34" rx="38" ry="24" fill="#c4b5fd" stroke="#2e1a52" stroke-width="3"/>
        <ellipse cx="60" cy="39" rx="14" ry="10" fill="#ffffff" stroke="#2e1a52" stroke-width="2"/>
        <ellipse cx="60" cy="35" rx="4" ry="2.5" fill="#4c1d95"/>
        <path d="M58 38 Q60 41 62 38" stroke="#4c1d95" stroke-width="2" stroke-linecap="round" fill="none"/>
        <circle cx="46" cy="32" r="3" fill="#2e1a52"/>
        <circle cx="47" cy="31" r="1" fill="#ffffff"/>
        <circle cx="74" cy="32" r="3" fill="#2e1a52"/>
        <circle cx="75" cy="31" r="1" fill="#ffffff"/>
        <ellipse cx="40" cy="38" rx="4" ry="2.5" fill="#f472b6" opacity="0.75"/>
        <ellipse cx="80" cy="38" rx="4" ry="2.5" fill="#f472b6" opacity="0.75"/>
      </svg>

      <!-- Ribbon Topper -->
      <svg id="topper-ribbon" class="topper-svg" viewBox="0 0 130 50" width="130" height="50" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M65 24 C50 10 20 8 10 24 C2 36 24 46 60 28 Z" fill="#f472b6" stroke="#831843" stroke-width="2.5"/>
        <path d="M65 24 C80 10 110 8 120 24 C128 36 106 46 70 28 Z" fill="#f472b6" stroke="#831843" stroke-width="2.5"/>
        <path d="M56 28 C48 38 42 46 36 50 C44 48 54 44 62 32 Z" fill="#ec4899" stroke="#831843" stroke-width="2"/>
        <path d="M74 28 C82 38 88 46 94 50 C86 48 76 44 68 32 Z" fill="#ec4899" stroke="#831843" stroke-width="2"/>
        <ellipse cx="65" cy="25" rx="9" ry="8" fill="#fbbf24" stroke="#78350f" stroke-width="2"/>
        <ellipse cx="65" cy="25" rx="5" ry="4" fill="#fef08a"/>
      </svg>

      <!-- Cat Topper -->
      <svg id="topper-cat" class="topper-svg" viewBox="0 0 120 50" width="120" height="50" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="30,40 16,14 44,24" fill="#fb923c" stroke="#7c2d12" stroke-width="3"/>
        <polygon points="28,34 20,18 38,24" fill="#fbcfe8"/>
        <polygon points="90,40 104,14 76,24" fill="#fb923c" stroke="#7c2d12" stroke-width="3"/>
        <polygon points="92,34 100,18 82,24" fill="#fbcfe8"/>
        <path d="M26 44 C40 32 80 32 94 44 Z" fill="#fed7aa" stroke="#7c2d12" stroke-width="3"/>
        <ellipse cx="44" cy="40" rx="3" ry="2" fill="#7c2d12"/>
        <ellipse cx="76" cy="40" rx="3" ry="2" fill="#7c2d12"/>
        <circle cx="60" cy="43" r="2" fill="#ea580c"/>
      </svg>

      <!-- Wings Topper -->
      <svg id="topper-wings" class="topper-svg" viewBox="0 0 160 50" width="160" height="50" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M80 32 C65 20 40 8 10 22 C25 35 48 40 70 36 Z" fill="rgba(255,255,255,0.85)" stroke="rgba(192,132,252,0.8)" stroke-width="2"/>
        <path d="M80 32 C95 20 120 8 150 22 C135 35 112 40 90 36 Z" fill="rgba(255,255,255,0.85)" stroke="rgba(192,132,252,0.8)" stroke-width="2"/>
        <circle cx="80" cy="32" r="7" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
        <polygon points="80,27 82,31 86,32 82,33 80,37 78,33 74,32 78,31" fill="#ffffff"/>
      </svg>
    </div>

    <!-- Main Card Body -->
    <div id="banner-card" class="theme-pastel-dream">
      <!-- Particle canvas -->
      <canvas id="banner-particle-canvas"></canvas>

      <!-- Glossy shine sweep -->
      <div id="banner-shine-overlay" class="banner-shine"></div>

      <!-- Inner Banner Grid -->
      <div class="banner-inner-layout">
        <!-- Left Column: Avatar Showcase -->
        <div class="banner-avatar-section" id="banner-avatar-section">
          <div class="banner-avatar-wrap">
            <img id="banner-avatar-img" class="banner-avatar-img" src="/assets/avatar.png" alt="Profile Picture" onerror="this.onerror=null;this.src='/assets/avatar.png';">
            <canvas id="banner-avatar-canvas" width="64" height="64" style="display: none;"></canvas>
          </div>
          <div class="banner-live-pill" id="banner-live-pill">
            <span class="live-pulse-dot"></span>
            <span class="live-pill-text" id="banner-pill-text">LIVE</span>
          </div>

/* Particle Canvas Engine */
class ParticleEngine {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas ? canvas.getContext('2d') : null;
    this.particles = [];
    this.type = 'sparkles';
    this.maxParticles = 22;
  }

  setType(type) {
    this.type = type || 'sparkles';
    this.particles = [];
    if (this.type === 'none') {
      this.clear();
    }
  }

  resize() {
    if (!this.canvas) return;
    const rect = this.canvas.getBoundingClientRect();
    this.canvas.width = rect.width || 820;
    this.canvas.height = rect.height || 270;
  }

  spawnParticle() {
    const w = this.canvas ? this.canvas.width : 820;
    const h = this.canvas ? this.canvas.height : 270;
    if (this.type === 'sakura') {
      return {
        x: Math.random() * (w + 60) - 30,
        y: -15,
        vx: Math.random() * 0.8 + 0.4,
        vy: Math.random() * 0.9 + 0.6,
        size: Math.random() * 6 + 5,
        angle: Math.random() * Math.PI * 2,
        vAngle: (Math.random() - 0.5) * 0.04,
        opacity: Math.random() * 0.6 + 0.35,
        life: 0,
        maxLife: Math.random() * 200 + 150
      };
    }
    if (this.type === 'hearts') {
      return {
        x: Math.random() * w,
        y: h + 15,
        vx: (Math.random() - 0.5) * 0.5,
        vy: -(Math.random() * 0.8 + 0.5),
        size: Math.random() * 6 + 6,
        angle: (Math.random() - 0.5) * 0.3,
        vAngle: (Math.random() - 0.5) * 0.02,
        opacity: Math.random() * 0.5 + 0.4,
        life: 0,
        maxLife: Math.random() * 180 + 120
      };
    }
    if (this.type === 'stars') {
      return {
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.4,
        vy: -(Math.random() * 0.5 + 0.2),
        size: Math.random() * 5 + 4,
        angle: Math.random() * Math.PI * 2,
        vAngle: (Math.random() - 0.5) * 0.05,
        opacity: 0,
        maxOpacity: Math.random() * 0.6 + 0.4,
        life: 0,
        maxLife: Math.random() * 140 + 100
      };
    }
    if (this.type === 'bubbles') {
      return {
        x: Math.random() * w,
        y: h + 15,
        vx: (Math.random() - 0.5) * 0.6,
        vy: -(Math.random() * 0.7 + 0.4),
        size: Math.random() * 7 + 4,
        angle: 0,
        vAngle: 0,
        opacity: Math.random() * 0.4 + 0.25,
        life: 0,
        maxLife: Math.random() * 180 + 120
      };
    }
    // sparkles (default)
    return {
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      size: Math.random() * 5 + 3,
      angle: 0,
      vAngle: 0.04,
      opacity: 0,
      maxOpacity: Math.random() * 0.8 + 0.2,
      life: 0,
      maxLife: Math.random() * 100 + 70
    };
  }

  update() {
    if (this.type === 'none' || !this.ctx || !this.canvas) return;
    if (this.particles.length < this.maxParticles && Math.random() < 0.25) {
      this.particles.push(this.spawnParticle());
    }

    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.life++;
      p.x += p.vx;
      p.y += p.vy;
      p.angle += p.vAngle;

      if (p.life < p.maxLife * 0.25) {
        p.opacity = (p.life / (p.maxLife * 0.25)) * (p.maxOpacity || 0.8);
      } else if (p.life > p.maxLife * 0.75) {
        p.opacity = (1 - (p.life - p.maxLife * 0.75) / (p.maxLife * 0.25)) * (p.maxOpacity || 0.8);
      }

      if (p.life >= p.maxLife || p.y < -30 || p.y > this.canvas.height + 30) {
        this.particles.splice(i, 1);
      }
    }
  }

  draw() {
    if (this.type === 'none' || !this.ctx || !this.canvas) return;
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

    for (const p of this.particles) {
      this.ctx.save();
      this.ctx.globalAlpha = Math.max(0, Math.min(1, p.opacity));
      this.ctx.translate(p.x, p.y);
      this.ctx.rotate(p.angle);

      if (this.type === 'sakura') {
        this.ctx.fillStyle = '#fbcfe8';
        this.ctx.strokeStyle = '#f472b6';
        this.ctx.lineWidth = 0.8;
        this.ctx.beginPath();
        this.ctx.moveTo(0, -p.size);
        this.ctx.quadraticCurveTo(p.size * 0.8, -p.size * 0.4, p.size * 0.6, p.size * 0.6);
        this.ctx.quadraticCurveTo(0, p.size * 0.9, -p.size * 0.6, p.size * 0.6);
        this.ctx.quadraticCurveTo(-p.size * 0.8, -p.size * 0.4, 0, -p.size);
        this.ctx.fill();
        this.ctx.stroke();
      } else if (this.type === 'hearts') {
        this.ctx.fillStyle = '#f472b6';
        this.ctx.beginPath();
        const r = p.size * 0.5;
        this.ctx.moveTo(0, r * 0.6);
        this.ctx.bezierCurveTo(-r, -r * 0.6, -r * 1.6, r * 0.4, 0, r * 1.6);
        this.ctx.bezierCurveTo(r * 1.6, r * 0.4, r, -r * 0.6, 0, r * 0.6);
        this.ctx.fill();
      } else if (this.type === 'stars') {
        this.ctx.fillStyle = '#fbbf24';
        this.ctx.beginPath();
        for (let s = 0; s < 5; s++) {
          const a1 = (s * Math.PI * 2) / 5 - Math.PI / 2;
          const a2 = a1 + Math.PI / 5;
          const x1 = Math.cos(a1) * p.size;
          const y1 = Math.sin(a1) * p.size;
          const x2 = Math.cos(a2) * (p.size * 0.45);
          const y2 = Math.sin(a2) * (p.size * 0.45);
          if (s === 0) this.ctx.moveTo(x1, y1);
          else this.ctx.lineTo(x1, y1);
          this.ctx.lineTo(x2, y2);
        }
        this.ctx.closePath();
        this.ctx.fill();
      } else if (this.type === 'bubbles') {
        this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
        this.ctx.fillStyle = 'rgba(192, 132, 252, 0.2)';
        this.ctx.lineWidth = 1.2;
        this.ctx.beginPath();
        this.ctx.arc(0, 0, p.size, 0, Math.PI * 2);
        this.ctx.fill();
        this.ctx.stroke();
      } else {
        // 4-point diamond sparkle
        this.ctx.fillStyle = '#ffffff';
        this.ctx.beginPath();
        this.ctx.moveTo(0, -p.size);
        this.ctx.quadraticCurveTo(0, 0, p.size, 0);
        this.ctx.quadraticCurveTo(0, 0, 0, p.size);
        this.ctx.quadraticCurveTo(0, 0, -p.size, 0);
        this.ctx.quadraticCurveTo(0, 0, 0, -p.size);
        this.ctx.fill();
      }
      this.ctx.restore();
    }
  }

  clear() {
    if (this.ctx && this.canvas) {
      this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    }
    this.particles = [];
  }
}

/* Multi-Scene Cycling Engine */
let currentSceneIndex = 0;
let sceneCycleTimer = null;

function switchScene(index) {
  const scenes = document.querySelectorAll('.banner-scene');
  if (!scenes || scenes.length === 0) return;

  currentSceneIndex = (index + scenes.length) % scenes.length;
  const transition = currentBanner.transitionStyle || 'slide';

  scenes.forEach((s, i) => {
    s.classList.remove('active', 'scene-slide', 'scene-fade', 'scene-pop', 'scene-flip');
    if (i === currentSceneIndex) {
      s.classList.add('active', 'scene-' + transition);
    }
  });

  // Update dots
  const dots = document.querySelectorAll('.scene-dot');
  dots.forEach((dot, i) => {
    dot.classList.toggle('active', i === currentSceneIndex);
  });

  // Reset progress bar animation
  const progressFill = document.getElementById('scene-progress-fill');
  if (progressFill) {
    progressFill.style.transition = 'none';
    progressFill.style.width = '0%';
    void progressFill.offsetWidth; // Reflow
    const dur = Math.max(2, Number(currentBanner.sceneDuration) || 5);
    if (currentBanner.autoCycle !== false) {
      progressFill.style.transition = `width ${dur}s linear`;
      progressFill.style.width = '100%';
    }
  }

  // Schedule next scene cycle if autoCycle is enabled
  if (sceneCycleTimer) clearTimeout(sceneCycleTimer);
  if (currentBanner.autoCycle !== false) {
    const durMs = Math.max(2, Number(currentBanner.sceneDuration) || 5) * 1000;
    sceneCycleTimer = setTimeout(() => {
      switchScene(currentSceneIndex + 1);
    }, durMs);
  }
}

// Scene dot click listener
document.querySelectorAll('.scene-dot').forEach(dot => {
  dot.addEventListener('click', e => {
    const idx = Number(e.currentTarget.getAttribute('data-scene-idx')) || 0;
    switchScene(idx);
  });
});

/* Update banner DOM from settings */
function applyBannerSettings(banner) {
  if (!banner || typeof banner !== 'object') return;
  Object.assign(currentBanner, banner);

  // Per paragraph line synchronization
  if (typeof banner.paragraphs === 'string' && banner.paragraphs.trim()) {
    const lines = banner.paragraphs.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if (nameEl) nameEl.textContent = lines[0] || currentBanner.name || '';
    if (subtitleEl) subtitleEl.textContent = lines[1] || currentBanner.subtitle || '';
    if (scheduleEl) scheduleEl.textContent = lines[2] || currentBanner.schedule || '';
    if (bioEl) bioEl.textContent = lines[3] || (lines.length > 1 ? lines[1] : (currentBanner.bio || ''));
  } else {
    if (typeof currentBanner.name === 'string' && nameEl) {
      nameEl.textContent = currentBanner.name;
    }
    if (typeof currentBanner.subtitle === 'string' && subtitleEl) {
      subtitleEl.textContent = currentBanner.subtitle;
    }
    if (typeof currentBanner.bio === 'string' && bioEl) {
      bioEl.textContent = currentBanner.bio;
    }
    if (typeof currentBanner.schedule === 'string' && scheduleEl) {
      scheduleEl.textContent = currentBanner.schedule;
    }
  }
  const scheduleRow = document.getElementById('banner-schedule-row');
  if (scheduleRow && scheduleEl) {
    scheduleRow.style.display = scheduleEl.textContent.trim() ? '' : 'none';
  }
  if (typeof currentBanner.statusBadge === 'string' && statusBadgeEl) {
    statusBadgeEl.textContent = currentBanner.statusBadge;
  }

  // Scale application
  const parsedScale = Number(currentBanner.scale);
  const scaleVal = Number.isFinite(parsedScale)
    ? Math.max(0.5, Math.min(1.5, parsedScale))
    : 1.0;
  if (containerEl) {
    containerEl.style.setProperty('--banner-scale', String(scaleVal));
  }

  // Aspect Ratio application
  const allowedRatios = ['3:1', '16:9', '4:1', '1:1'];
  const ratio = allowedRatios.includes(currentBanner.aspectRatio) ? currentBanner.aspectRatio : '3:1';
  if (containerEl) {
    containerEl.setAttribute('data-ratio', ratio);
  }

  // Template Theme application
  const validTemplates = ['pastel-dream', 'cozy-cat', 'magical-ribbon', 'pixel-arcade', 'sakura-blossom'];
  const tpl = validTemplates.includes(currentBanner.template) ? currentBanner.template : 'pastel-dream';
  if (cardEl) {
    for (const t of validTemplates) {
      cardEl.classList.remove('theme-' + t);
    }
    cardEl.classList.add('theme-' + tpl);
  }

  // Continuous Motion Animation application
  const validAnims = ['float', 'sway', 'pulse', 'breathe', 'bounce'];
  const anim = validAnims.includes(currentBanner.animation) ? currentBanner.animation : 'float';
  if (containerEl) {
    containerEl.setAttribute('data-animation', anim);
    for (const a of validAnims) {
      containerEl.classList.remove('anim-' + a);
    }
    containerEl.classList.add('anim-' + anim);
  }

  // Topper application
  const topper = (currentBanner.topper || 'bear').toLowerCase();
  if (containerEl) {
    containerEl.setAttribute('data-topper', topper);
  }
  if (topperEl) {
    topperEl.setAttribute('data-topper', topper);
    if (topper === 'none') {
      topperEl.style.display = 'none';
      topperEl.classList.add('hidden');
    } else {
      topperEl.style.display = '';
      topperEl.classList.remove('hidden');
    }
  }

  // Particle Engine update
  if (particleEngine) {
    particleEngine.setType(currentBanner.particles || 'sparkles');
    particleEngine.resize();
  }

  // Glossy Shine sweep toggle
  if (shineOverlayEl) {
    if (currentBanner.shineEffect === false) {
      shineOverlayEl.classList.add('hidden');
    } else {
      shineOverlayEl.classList.remove('hidden');
    }
  }

  // Avatar section toggle & TikTok PFP image resolution
  const avatarSec = document.getElementById('banner-avatar-section');
  if (avatarSec) {
    avatarSec.style.display = currentBanner.showAvatar === false ? 'none' : '';
  }
  const avatarImg = document.getElementById('banner-avatar-img');
  if (avatarImg) {
    const rawAvatar = currentBanner.avatarUrl || currentBanner.avatar || '';
    if (rawAvatar && typeof rawAvatar === 'string' && rawAvatar.trim()) {
      const cleanAvatar = rawAvatar.trim();
      if (cleanAvatar.startsWith('http://') || cleanAvatar.startsWith('https://')) {
        if (typeof location !== 'undefined' && location.protocol && location.protocol.startsWith('http')) {
          avatarImg.src = '/api/avatar-proxy?url=' + encodeURIComponent(cleanAvatar);
        } else {
          avatarImg.src = cleanAvatar;
        }
      } else {
        avatarImg.src = cleanAvatar;
      }
    } else {
      avatarImg.src = '/assets/avatar.png';
    }
  }

  // Social handles rendering
  if (socialsGridEl) {
    if (socialsGridEl.children && typeof socialsGridEl.children.length === 'number') {
      try { socialsGridEl.children.length = 0; } catch (e) {}
    }
    socialsGridEl.innerHTML = '';
    const socials = currentBanner.socials || {};
    const platforms = ['twitch', 'tiktok', 'discord', 'twitter', 'instagram', 'youtube'];
    for (const plat of platforms) {
      const handle = socials[plat];
      if (typeof handle === 'string' && handle.trim().length > 0) {
        const badge = document.createElement('div');
        badge.className = 'banner-social-badge';
        badge.setAttribute('data-platform', plat);
        badge.innerHTML = (SOCIAL_ICONS[plat] || '') + '<span class="banner-social-handle">' + escapeHtml(handle.trim()) + '</span>';
        socialsGridEl.appendChild(badge);
      }
    }
  }

  // Visibility toggle
  if (containerEl && typeof currentBanner.enabled === 'boolean') {
    containerEl.style.display = currentBanner.enabled ? '' : 'none';
  }

  // Trigger scene progress / cycle update
  switchScene(currentSceneIndex);
}

/* Companion color derivation & synchronization */
const BASE_PAL = {
  o: '#1a0f2e', s: '#ffe3d6', b: '#ff9fbf', e: '#ffffff', m: '#7a2a4a', t: '#2e1a52'
};
const VARIANTS = [
  { name: 'Amethyst', H: '#7b3fe4', h: '#b48cff', d: '#4b1fa0', E: '#4a148c', L: '#9c6bff', C: '#9b5cf0', c: '#d9c2ff', k: '#6a35c2', r: '#e6a8ff' },
  { name: 'Lavender', H: '#a98be8', h: '#ddd0ff', d: '#7c63c4', E: '#6a4fb0', L: '#bfa8ff', C: '#c4aef5', c: '#f3ecff', k: '#9a84d8', r: '#ffc6ec', o: '#3b2a5c' },
  { name: 'Midnight', H: '#4a1d9e', h: '#7d4fe0', d: '#2a0f63', E: '#2b0a5c', L: '#6e3fd6', C: '#5b2aa8', c: '#a98be8', k: '#3a1878', r: '#b06cff', o: '#0a0614' },
  { name: 'Neon',     H: '#b03cff', h: '#ff8cf0', d: '#6d1fb8', E: '#5b00a8', L: '#ff4fd8', C: '#c25cff', c: '#7ffcff', k: '#8a2be2', r: '#ff4fd8', e: '#bffcff' }
];

let activePalette = Object.assign({}, BASE_PAL, VARIANTS[0]);
let RGB = {};
let CHAR_CACHE = {};

function hexToRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255];
}

function normalizeHex(hex, fallback) {
  const s = String(hex || '').trim().toLowerCase();
  return /^#[0-9a-f]{6}$/.test(s) ? s : fallback;
}

function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h = 0, s = 0, l = (max + min) / 2;
  if (max !== min) {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    switch (max) {
      case r: h = (g - b) / d + (g < b ? 6 : 0); break;
      case g: h = (b - r) / d + 2; break;
      case b: h = (r - g) / d + 4; break;
    }
    h *= 60;
  }
  return [h, s * 100, l * 100];
}

function hslToHex(h, s, l) {
  h = ((h % 360) + 360) % 360;
  s = Math.max(0, Math.min(100, s)) / 100;
  l = Math.max(0, Math.min(100, l)) / 100;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; }
  else if (h < 120) { r = x; g = c; }
  else if (h < 180) { g = c; b = x; }
  else if (h < 240) { g = x; b = c; }
  else if (h < 300) { r = x; b = c; }
  else { r = c; b = x; }
  const toHex = v => Math.round((v + m) * 255).toString(16).padStart(2, '0');
  return '#' + toHex(r) + toHex(g) + toHex(b);
}

function deriveHairPalette(hex) {
  const H = normalizeHex(hex, VARIANTS[0].H);
  const preset = VARIANTS.find(v => v.H.toLowerCase() === H);
  if (preset) {
    return {
      H: preset.H, h: preset.h, d: preset.d, E: preset.E, L: preset.L,
      o: preset.o || BASE_PAL.o, e: preset.e || BASE_PAL.e
    };
  }
  const [hue, sat, lit] = rgbToHsl(...hexToRgb(H));
  const lowSat = sat < 10;
  return {
    H,
    h: hslToHex(hue - 4, lowSat ? sat : Math.min(100, sat + 18), Math.max(30, Math.min(96, lit + Math.max(10, (98 - lit) * 0.45)))),
    d: hslToHex(hue + 3, lowSat ? sat : Math.min(100, Math.max(24, sat - 6)), Math.max(8, lit - 19)),
    E: hslToHex(hue + 5, lowSat ? 18 : Math.min(100, sat + 8), Math.max(12, Math.min(52, lit - 24))),
    L: hslToHex(hue - 2, lowSat ? 24 : Math.min(100, sat + 20), Math.max(48, Math.min(86, lit + 14))),
    o: BASE_PAL.o,
    e: BASE_PAL.e
  };
}

function deriveOutfitPalette(hex) {
  const C = normalizeHex(hex, VARIANTS[0].C);
  const preset = VARIANTS.find(v => v.C.toLowerCase() === C);
  if (preset) {
    return { C: preset.C, c: preset.c, k: preset.k, r: preset.r };
  }
  const [hue, sat, lit] = rgbToHsl(...hexToRgb(C));
  const lowSat = sat < 10;
  return {
    C,
    c: hslToHex(hue - 3, lowSat ? sat : Math.min(100, sat + 16), Math.max(68, Math.min(96, lit + 23))),
    k: hslToHex(hue - 3, lowSat ? sat : Math.max(20, sat - 16), Math.max(12, lit - 17)),
    r: hslToHex(hue + 20, lowSat ? 65 : Math.min(100, Math.max(75, sat + 18)), Math.max(66, Math.min(88, lit + 16)))
  };
}

function applyCustomColors(hairHex, outfitHex) {
  const hp = deriveHairPalette(hairHex);
  const op = deriveOutfitPalette(outfitHex);
  activePalette = Object.assign({}, BASE_PAL, hp, op);
  RGB = {};
  for (const k in activePalette) {
    if (k !== 'name') RGB[k] = hexToRgb(activePalette[k]);
  }
  CHAR_CACHE = {};
}

function applyCompanionSettings(comp) {
  if (!comp || typeof comp !== 'object') return;
  Object.assign(currentCompanion, comp);
  const h = currentCompanion.hc || currentCompanion.hairColor || VARIANTS[0].H;
  const o = currentCompanion.oc || currentCompanion.outfitColor || VARIANTS[0].C;
  applyCustomColors(h, o);
}

/* Pixel art chibi sprite builder */
const SW = 34, SH = 42, CX = 15.5;

function buildSprite(bob, eyes, mouth) {
  const g = Array.from({ length: SH }, () => Array(SW).fill('.'));
  const set = (x, y, k) => {
    x = Math.round(x); y = Math.round(y);
    if (x >= 0 && x < SW && y >= 0 && y < SH) g[y][x] = k;
  };
  const setS = (x, y, k) => {
    set(x, y, k);
    set(Math.round(2 * CX - x), y, k);
  };
  const b = bob;
  const hb = b;

  // Head Outline & Skin fill
  for (let dy = -7; dy <= 6; dy++) {
    const py = 12 + hb + dy;
    const rx = Math.sqrt(Math.max(0, 1 - (dy / 8) * (dy / 8))) * 7.5;
    for (let px = Math.round(CX - rx); px <= Math.round(CX + rx); px++) {
      set(px, py, 's');
    }
  }

  // Hair Base (Forehead & Bangs)
  for (let dx = -7; dx <= 7; dx++) {
    set(CX + dx, 5 + hb, 'H');
    set(CX + dx, 6 + hb, 'H');
    if (Math.abs(dx) < 6) set(CX + dx, 4 + hb, 'h');
  }

  // Twintails side tufts
  setS(7, 7 + hb, 'H');
  setS(8, 8 + hb, 'H');
  setS(7, 9 + hb, 'd');
  setS(6, 11 + hb, 'H');
  setS(5, 13 + hb, 'H');
  setS(4, 15 + hb, 'd');

  // Eyes
  if (eyes === 'open') {
    setS(12, 12 + hb, 'E');
    setS(12, 13 + hb, 'L');
    setS(13, 12 + hb, 'e');
  } else if (eyes === 'half') {
    setS(12, 13 + hb, 'E');
    setS(13, 13 + hb, 'E');
  } else {
    setS(12, 13 + hb, 'o');
    setS(13, 13 + hb, 'o');
  }

  // Cheeks blush
  setS(10, 14 + hb, 'b');

  // Mouth
  set(CX, 15 + hb, 'm');

  // Body Hoodie & Limbs
  for (let dy = 0; dy <= 12; dy++) {
    const py = 19 + b + dy;
    for (let px = Math.round(CX - 5); px <= Math.round(CX + 5); px++) {
      set(px, py, 'C');
    }
  }
  set(CX, 21 + b, 'k');
  set(CX, 22 + b, 'k');
  set(CX, 23 + b, 'k');

  // Skirt / legs
  for (let dy = 0; dy <= 6; dy++) {
    setS(13, 32 + b + dy, 's');
    setS(14, 32 + b + dy, 's');
  }
  setS(13, 38 + b, 'o');
  setS(14, 38 + b, 'o');

  return g;
}

function getCharSprite(bob, eyes, mouth) {
  const hair = currentCompanion.hair || 'twintails';
  const key = hair + '_' + bob + '_' + eyes + '_' + mouth;
  let entry = CHAR_CACHE[key];
  if (!entry) {
    const grid = buildSprite(bob, eyes, mouth);
    let c = null;
    if (typeof document !== 'undefined' && document.createElement) {
      c = document.createElement('canvas');
      c.width = SW; c.height = SH;
      const cx = c.getContext('2d');
      if (cx && cx.createImageData) {
        const img = cx.createImageData(SW, SH);
        for (let y = 0; y < SH; y++) {
          for (let x = 0; x < SW; x++) {
            const k = grid[y][x];
            if (k === '.') continue;
            const rgb = RGB[k] || [255, 255, 255];
            const i = (y * SW + x) * 4;
            img.data[i] = rgb[0];
            img.data[i + 1] = rgb[1];
            img.data[i + 2] = rgb[2];
            img.data[i + 3] = 255;
          }
        }
        cx.putImageData(img, 0, 0);
      }
    }
    entry = { canvas: c, grid };
    CHAR_CACHE[key] = entry;
  }
  return entry;
}

/* Avatar animation loop */
let avatarState = {
  bob: 0,
  bobTimer: 0,
  blinkTimer: 3000,
  blinkPhase: -1,
  eyes: 'open'
};

function updateAvatar(dt) {
  avatarState.bobTimer += dt;
  avatarState.bob = Math.floor((Math.sin(avatarState.bobTimer / 380) + 1) * 0.5);

  if (avatarState.blinkPhase < 0) {
    avatarState.blinkTimer -= dt;
    if (avatarState.blinkTimer <= 0) {
      avatarState.blinkPhase = 0;
      avatarState.blinkTimer = 0;
    }
  } else {
    avatarState.blinkTimer += dt;
    avatarState.blinkPhase = Math.floor(avatarState.blinkTimer / 45);
    if (avatarState.blinkPhase > 3) {
      avatarState.blinkPhase = -1;
      avatarState.blinkTimer = 2600 + Math.random() * 2400;
    }
  }

  avatarState.eyes = avatarState.blinkPhase < 0
    ? 'open'
    : ['half', 'closed', 'closed', 'half'][avatarState.blinkPhase];
}

function renderAvatar() {
  if (!avatarCtx) return;
  avatarCtx.clearRect(0, 0, 64, 64);
  const sprite = getCharSprite(avatarState.bob, avatarState.eyes, 'neutral');
  if (sprite && sprite.canvas) {
    const ox = Math.floor((64 - SW) / 2);
    const oy = Math.floor((64 - SH) / 2);
    avatarCtx.drawImage(sprite.canvas, ox, oy);
  }
}

let lastFrameTime = performance.now();
function animateLoop(now) {
  const dt = Math.min(now - lastFrameTime, 100);
  lastFrameTime = now;
  updateAvatar(dt);
  renderAvatar();

  if (particleEngine) {
    particleEngine.update();
    particleEngine.draw();
  }

  requestAnimationFrame(animateLoop);
}

/* Master settings application */
function applyAllSettings(settings) {
  if (!settings || typeof settings !== 'object') return;
  if (settings.banner) {
    if (!settings.banner.avatarUrl && (settings.avatar || settings.userAvatar)) {
      settings.banner.avatarUrl = settings.avatar || settings.userAvatar;
    }
    applyBannerSettings(settings.banner);
  }
  if (settings.companion) {
    applyCompanionSettings(settings.companion);
  }
}

/* Fallback HTTP fetch */
function fetchInitialSettings() {
  fetch('/api/settings')
    .then(res => res.json())
    .then(data => {
      if (data) applyAllSettings(data);
    })
    .catch(() => {});
}

/* WebSocket real-time connection with resilient auto-reconnect */
function connectWS() {
  if (typeof location === 'undefined' || !location.host || location.protocol === 'file:') return;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  try {
    const ws = new WebSocket(proto + '//' + location.host + '/ws');

    ws.onopen = () => {
      console.log('Streamer Info Banner connected to WebSocket');
    };

    ws.onmessage = evt => {
      try {
        const msg = JSON.parse(evt.data);
        if (msg.type === 'init' || msg.type === 'settings:update') {
          if (msg.settings) applyAllSettings(msg.settings);
        } else if (msg.type === 'banner:test-scene' && typeof msg.scene === 'number') {
          switchScene(msg.scene);
        }
      } catch (err) {}
    };

    ws.onclose = () => {
      setTimeout(connectWS, 2000);
    };

    ws.onerror = () => {
      try { ws.close(); } catch (_) {}
    };
  } catch (err) {}
}

/* Window resize listener to keep particle canvas crisp */
window.addEventListener('resize', () => {
  if (particleEngine) particleEngine.resize();
});

/* Initialization */
applyCustomColors(currentCompanion.hc, currentCompanion.oc);
applyBannerSettings(currentBanner);
fetchInitialSettings();
connectWS();
requestAnimationFrame(animateLoop);
</script>
