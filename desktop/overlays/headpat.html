<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shing Live - Pet-Pet Headpat Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Nunito', sans-serif;
    user-select: none;
  }

  #headpat-stage {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  #headpat-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    transform: scale(0.75) translateY(20px);
    transition: opacity 0.32s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  #headpat-card.active {
    opacity: 1;
    transform: scale(1) translateY(0);
  }

  .canvas-bubble {
    position: relative;
    width: 224px;
    height: 224px;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.45));
  }

  #petpet-canvas {
    width: 224px;
    height: 224px;
    image-rendering: auto;
  }

  .headpat-caption {
    margin-top: 6px;
    padding: 8px 18px;
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(30, 22, 43, 0.92), rgba(45, 26, 64, 0.92));
    border: 2px solid rgba(255, 133, 162, 0.65);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), 0 0 15px rgba(255, 133, 162, 0.3);
    text-align: center;
    color: #fff;
  }

  .headpat-user {
    font-size: 16px;
    font-weight: 900;
    color: #ffb3c6;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
  }

  .headpat-reason {
    font-size: 12px;
    font-weight: 800;
    color: #f1f5f9;
    letter-spacing: 0.4px;
  }
</style>
</head>
<body>

<div id="headpat-stage">
  <div id="headpat-card">
    <div class="canvas-bubble">
      <canvas id="petpet-canvas" width="224" height="224"></canvas>
    </div>
    <div class="headpat-caption">
      <div class="headpat-user" id="headpat-user">@Viewer</div>
      <div class="headpat-reason" id="headpat-reason">Good Viewer Headpat!</div>
    </div>
  </div>
</div>

<script>
(function() {
  const RESOLUTION = 224;
  const FRAMES = 10;
  const canvas = document.getElementById('petpet-canvas');
  const ctx = canvas.getContext('2d');
  const cardEl = document.getElementById('headpat-card');
  const userEl = document.getElementById('headpat-user');
  const reasonEl = document.getElementById('headpat-reason');

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = RESOLUTION * dpr;
  canvas.height = RESOLUTION * dpr;
  ctx.scale(dpr, dpr);

  // Preload official 10-frame PetPet hand sprites (pet0.gif .. pet9.gif)
  const handFrames = [];
  for (let i = 0; i < FRAMES; i++) {
    const img = new Image();
    img.src = `/assets/petpet/pet${i}.gif`;
    handFrames.push(img);
  }

  const fallbackImg = new Image();
  fallbackImg.crossOrigin = 'anonymous';
  fallbackImg.src = '/assets/avatar.png';

  let headpatSettings = {
    triggerOnFollow: true,
    triggerOnGift: true,
    durationSec: 5,
    speed: 1.0
  };
  let universalVolume = 0.85;
  let universalMuted = false;

  const queue = [];
  let isPlaying = false;
  let activeAvatarImg = null;
  let animFrameId = null;
  let currentFrame = 0;
  let lastFrameTime = 0;

  function resolveAvatar(url) {
    if (!url || url.includes('assets/avatar.png')) return '/assets/avatar.png';
    if (url.startsWith('/')) return url;
    return '/api/avatar-proxy?url=' + encodeURIComponent(url);
  }

  function loadAvatarImage(url) {
    return new Promise((resolve) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      const timer = setTimeout(() => resolve(fallbackImg), 3500);
      img.onload = () => {
        clearTimeout(timer);
        resolve(img);
      };
      img.onerror = () => {
        clearTimeout(timer);
        resolve(fallbackImg);
      };
      img.src = resolveAvatar(url);
    });
  }

  function renderFrame(timestamp) {
    if (!isPlaying) return;

    const speedMult = Math.max(0.4, Math.min(2.5, Number(headpatSettings.speed) || 1.0));
    const frameInterval = 42 / speedMult;

    if (!lastFrameTime || timestamp - lastFrameTime >= frameInterval) {
      lastFrameTime = timestamp;
      currentFrame = (currentFrame + 1) % FRAMES;

      ctx.clearRect(0, 0, RESOLUTION, RESOLUTION);

      // Authentic petpetgif.com 10-frame deformation math
      const i = currentFrame;
      const j = i < FRAMES / 2 ? i : FRAMES - i;
      const width = 0.8 + j * 0.02;
      const height = 0.8 - j * 0.05;
      const offsetX = (1 - width) * 0.5 + 0.1;
      const offsetY = (1 - height) - 0.08;

      const drawX = RESOLUTION * offsetX;
      const drawY = RESOLUTION * offsetY;
      const drawW = RESOLUTION * width;
      const drawH = RESOLUTION * height;

      const avatar = activeAvatarImg || fallbackImg;

      // Draw circular/squished TikTok profile picture
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(drawX + drawW / 2, drawY + drawH / 2, drawW / 2, drawH / 2, 0, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();
      try {
        ctx.drawImage(avatar, drawX, drawY, drawW, drawH);
      } catch (_) {}
      ctx.restore();

      // Draw official PetPet hand frame on top
      const handImg = handFrames[i];
      if (handImg && handImg.complete) {
        try {
          ctx.drawImage(handImg, 0, 0, RESOLUTION, RESOLUTION);
        } catch (_) {}
      }
    }

    animFrameId = requestAnimationFrame(renderFrame);
  }

  function playSoftPatChime() {
    if (universalMuted || universalVolume <= 0) return;
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const actx = new AudioCtx();
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(520, actx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(780, actx.currentTime + 0.14);
      gain.gain.setValueAtTime(0.18 * universalVolume, actx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.18);
      osc.connect(gain);
      gain.connect(actx.destination);
      osc.start();
      osc.stop(actx.currentTime + 0.19);
    } catch (_) {}
  }

  async function processQueue() {
    if (isPlaying || queue.length === 0) return;
    isPlaying = true;
    const item = queue.shift();

    activeAvatarImg = await loadAvatarImage(item.avatar);
    userEl.textContent = '@' + (item.nickname || item.user || 'Viewer');
    reasonEl.textContent = item.reasonText || 'Headpat Time!';
    currentFrame = 0;
    lastFrameTime = 0;

    cardEl.classList.add('active');
    playSoftPatChime();
    if (animFrameId) cancelAnimationFrame(animFrameId);
    animFrameId = requestAnimationFrame(renderFrame);

    const durMs = Math.max(2, Math.min(15, Number(headpatSettings.durationSec) || 5)) * 1000;
    setTimeout(() => {
      cardEl.classList.remove('active');
      setTimeout(() => {
        isPlaying = false;
        if (animFrameId) cancelAnimationFrame(animFrameId);
        animFrameId = null;
        processQueue();
      }, 360);
    }, durMs);
  }

  function enqueueHeadpat(data, reasonText) {
    queue.push({
      user: data.user || data.nickname || 'Viewer',
      nickname: data.nickname || data.user || 'Viewer',
      avatar: data.avatar || '/assets/avatar.png',
      reasonText
    });
    processQueue();
  }

  function applySettings(s) {
    if (!s) return;
    if (typeof s.universalVolume === 'number') universalVolume = s.universalVolume;
    if (typeof s.universalMuted === 'boolean') universalMuted = s.universalMuted;
    if (s.headpat) {
      headpatSettings = Object.assign({}, headpatSettings, s.headpat);
    }
  }

  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(proto + '//' + location.host);

    ws.onmessage = (evt) => {
      try {
        const msg = JSON.parse(evt.data);
        if (msg.type === 'init' || msg.type === 'settings:update') {
          applySettings(msg.settings);
        } else if (msg.type === 'follow') {
          if (headpatSettings.triggerOnFollow !== false) {
            enqueueHeadpat(msg, 'Thanks for following! *pat pat*');
          }
        } else if (msg.type === 'gift') {
          if (headpatSettings.triggerOnGift !== false) {
            const gName = msg.giftName || 'a Gift';
            enqueueHeadpat(msg, 'Sent ' + gName + '! *pat pat*');
          }
        } else if (msg.type === 'headpat:trigger') {
          enqueueHeadpat(msg, msg.reasonText || 'Headpat Time! *pat pat*');
        }
      } catch (_) {}
    };

    ws.onclose = () => setTimeout(connectWS, 2500);
  }

  connectWS();
})();
</script>
</body>
</html>
