<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shing Glass Jar Overlay</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  #container {
    position: relative;
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #jar-stage {
    position: relative;
    width: 764px;
    height: 1024px;
    max-width: 100vw;
    max-height: 100vh;
    will-change: transform;
  }
  .layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  #jar-back {
    z-index: 1;
    object-fit: contain;
  }
  #physics-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
  }
  #jar-front {
    z-index: 3;
    object-fit: contain;
  }

  /* Combo Badge above jar mouth */
  #combo-badge {
    position: absolute;
    top: 130px;
    left: 50%;
    transform: translateX(-50%) scale(0.8);
    opacity: 0;
    z-index: 10;
    background: linear-gradient(135deg, #ff4785, #7b3fe4);
    color: #fff;
    padding: 8px 24px;
    border-radius: 28px;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.5px;
    box-shadow: 0 8px 24px rgba(255, 71, 133, 0.45);
    border: 2px solid rgba(255, 255, 255, 0.6);
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    text-transform: uppercase;
  }
  #combo-badge.show {
    opacity: 1;
    transform: translateX(-50%) scale(1);
    animation: comboPulse 0.4s ease;
  }
  @keyframes comboPulse {
    0% { transform: translateX(-50%) scale(0.9); }
    50% { transform: translateX(-50%) scale(1.15); }
    100% { transform: translateX(-50%) scale(1); }
  }

  /* Biggest Gift Spotlight Badge */
  #gift-counter {
    position: absolute;
    bottom: 34px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    background: linear-gradient(135deg, rgba(38, 18, 68, 0.94), rgba(76, 29, 149, 0.94));
    color: #fff;
    padding: 8px 24px;
    border-radius: 26px;
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: 0.3px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), 0 0 16px rgba(168, 85, 247, 0.3);
    border: 1.5px solid rgba(255, 209, 102, 0.45);
    display: flex;
    align-items: center;
    gap: 8px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.35s ease, transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
    white-space: nowrap;
    backdrop-filter: blur(8px);
  }
  #gift-counter.visible { opacity: 1; }
  #gift-counter.counter-pop {
    transform: translateX(-50%) scale(1.12);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4), 0 0 24px rgba(255, 209, 102, 0.65);
    border-color: rgba(255, 209, 102, 0.85);
  }
  .top-gift-icon {
    display: inline-flex;
    align-items: center;
    color: #ffd166;
    filter: drop-shadow(0 0 4px rgba(255, 209, 102, 0.6));
  }
  .top-gift-label {
    color: #e9d5ff;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 700;
  }
  .top-gift-sender {
    color: #ffffff;
    font-weight: 800;
  }
  .top-gift-sep {
    color: rgba(255, 255, 255, 0.4);
    font-size: 12px;
  }
  .top-gift-detail {
    color: #fef08a;
    font-weight: 700;
  }
</style>
<script src="/assets/matter.min.js"></script>
</head>
<body>
<div id="container">
  <div id="jar-stage">
    <div id="combo-badge">ROSE COMBO x5</div>
    <img id="jar-back" class="layer" src="/assets/jar/jar-back.png" alt="Jar Back">
    <canvas id="physics-canvas" width="764" height="1024"></canvas>
    <img id="jar-front" class="layer" src="/assets/jar/jar-front.png" alt="Jar Front">
    <div id="gift-counter">
      <span class="top-gift-icon">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .55-.45 1-1 1H6c-.55 0-1-.45-1-1v-1h14v1z"/>
        </svg>
      </span>
      <span class="top-gift-label">Top Gift:</span>
      <span id="top-gift-sender" class="top-gift-sender">Awaiting...</span>
      <span class="top-gift-sep">•</span>
      <span id="top-gift-detail" class="top-gift-detail">0 coins</span>
    </div>
  </div>
</div>

<script>
'use strict';

const jarStage = document.getElementById('jar-stage');
const comboBadge = document.getElementById('combo-badge');
const counterEl = document.getElementById('gift-counter');
const topSenderEl = document.getElementById('top-gift-sender');
const topDetailEl = document.getElementById('top-gift-detail');

const GIFT_ICONS = {
  rose: '/assets/gifts/rose.png',
  heart_me: '/assets/gifts/heart_me.png',
  gg: '/assets/gifts/gg.png',
  ice_cream: '/assets/gifts/ice_cream.png',
  doughnut: '/assets/gifts/doughnut.png',
  perfume: '/assets/gifts/perfume.png',
  tiktok: '/assets/gifts/tiktok.png',
  galaxy: '/assets/gifts/galaxy.png',
  panda: '/assets/gifts/panda.png',
  cap: '/assets/gifts/cap.png',
  sunglasses: '/assets/gifts/sunglasses.png',
  money_gun: '/assets/gifts/money_gun.png',
  lion: '/assets/gifts/lion.png',
  universe: '/assets/gifts/universe.png'
};

const preloadedImgs = {};
Object.entries(GIFT_ICONS).forEach(([k, src]) => {
  const img = new Image();
  img.src = src;
  preloadedImgs[k] = img;
});

// Cache for all 676+ TikTok gifts
const catalogMap = {};
fetch('/api/gifts')
  .then(r => r.json())
  .then(list => {
    if (Array.isArray(list)) {
      list.forEach(g => {
        if (!g.image) return;
        const idStr = String(g.id);
        catalogMap[idStr] = g.image;
        if (g.name) {
          const nameLower = g.name.toLowerCase();
          catalogMap[nameLower] = g.image;
          catalogMap[nameLower.replace(/[^a-z0-9]/g, '_')] = g.image;
          catalogMap[nameLower.replace(/[^a-z0-9]/g, '')] = g.image;
          if (nameLower.includes('universe')) {
            catalogMap['universe'] = g.image;
            catalogMap['tiktok_universe'] = g.image;
          }
          if (nameLower.includes('lion')) {
            catalogMap['lion'] = g.image;
          }
          if (nameLower.includes('money') && nameLower.includes('gun')) {
            catalogMap['money_gun'] = g.image;
          }
        }
      });
    }
  })
  .catch(() => {});

function resolveGiftUrl(key, rawUrl, name) {
  if (rawUrl && typeof rawUrl === 'string' && rawUrl.length > 5) return rawUrl;
  const cleanKey = (key || '').toLowerCase().replace(/[^a-z0-9_]/g, '');
  if (GIFT_ICONS[cleanKey]) return GIFT_ICONS[cleanKey];
  if (catalogMap[cleanKey]) return catalogMap[cleanKey];
  if (key && catalogMap[key]) return catalogMap[key];
  if (name && catalogMap[name.toLowerCase()]) return catalogMap[name.toLowerCase()];
  const localCandidates = ['universe', 'lion', 'money_gun', 'galaxy', 'rose', 'heart_me', 'gg', 'cap', 'doughnut', 'ice_cream', 'panda', 'perfume', 'sunglasses', 'tiktok'];
  for (const c of localCandidates) {
    if (cleanKey.includes(c) || (name && name.toLowerCase().includes(c))) {
      return `/assets/gifts/${c}.png`;
    }
  }
  return null;
}

function getGiftImage(key, url, name) {
  const cacheKey = key || name || 'gift';
  if (preloadedImgs[cacheKey]) return preloadedImgs[cacheKey];
  const resolvedUrl = resolveGiftUrl(key, url, name);
  if (resolvedUrl) {
    const img = new Image();
    img.src = resolvedUrl;
    preloadedImgs[cacheKey] = img;
    return img;
  }
  return null;
}

// Setup Matter.js
const { Engine, World, Bodies, Body, Events } = Matter;
const engine = Engine.create({ enableSleeping: false });
engine.gravity.y = 0.95;

const canvas = document.getElementById('physics-canvas');
const ctx = canvas.getContext('2d');
const W = 764, H = 1024;

// Top Gift record tracker
let topGiftRecord = {
  sender: '',
  giftName: '',
  coins: 0,
  count: 0,
  totalValue: 0
};

function recordTopGift(sender, giftName, coins, count = 1) {
  const totalVal = Math.max(1, coins) * Math.max(1, count);
  if (totalVal >= topGiftRecord.totalValue) {
    topGiftRecord = {
      sender: sender || 'Viewer',
      giftName: giftName || 'Gift',
      coins: coins,
      count: count,
      totalValue: totalVal
    };

    if (topSenderEl) topSenderEl.textContent = topGiftRecord.sender;
    if (topDetailEl) {
      topDetailEl.textContent = `${topGiftRecord.giftName} (${topGiftRecord.totalValue.toLocaleString()} coins)`;
    }

    if (counterEl) {
      counterEl.classList.add('visible');
      counterEl.classList.remove('counter-pop');
      void counterEl.offsetWidth;
      counterEl.classList.add('counter-pop');
      setTimeout(() => counterEl.classList.remove('counter-pop'), 350);
    }
  }
}

// Build collision walls matching the glass jar curve plus outer floor for overflow
function createJarWalls() {
  const walls = [];
  const wallThick = 26;
  const innerWallOpts = { isStatic: true, friction: 0.1, restitution: 0.35, render: { visible: false } };
  const outerWallOpts = { isStatic: true, friction: 0.45, restitution: 0.18, render: { visible: false } };

  // Bottom floor inside jar
  walls.push(Bodies.rectangle(382, 852, 420, wallThick, innerWallOpts));

  // Outer stage floor (catches overflowing gifts so they pile around the base and never disappear)
  walls.push(Bodies.rectangle(382, 955, 764, 40, outerWallOpts));

  // Outer left containment boundary
  walls.push(Bodies.rectangle(12, 512, 24, 1024, outerWallOpts));

  // Outer right containment boundary
  walls.push(Bodies.rectangle(752, 512, 24, 1024, outerWallOpts));

  // Left curve segments (double-sided collisions)
  const leftPoints = [
    [190, 240], [140, 320], [95, 420], [70, 520], [68, 620], [95, 720], [145, 800], [195, 845]
  ];
  for (let i = 0; i < leftPoints.length - 1; i++) {
    const p1 = leftPoints[i], p2 = leftPoints[i + 1];
    const cx = (p1[0] + p2[0]) / 2, cy = (p1[1] + p2[1]) / 2;
    const len = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
    const angle = Math.atan2(p2[1] - p1[1], p2[0] - p1[0]);
    walls.push(Bodies.rectangle(cx - wallThick * 0.4, cy, len + 2, wallThick, { ...innerWallOpts, angle }));
  }

  // Right curve segments (double-sided collisions)
  const rightPoints = [
    [574, 240], [624, 320], [669, 420], [694, 520], [696, 620], [669, 720], [619, 800], [569, 845]
  ];
  for (let i = 0; i < rightPoints.length - 1; i++) {
    const p1 = rightPoints[i], p2 = rightPoints[i + 1];
    const cx = (p1[0] + p2[0]) / 2, cy = (p1[1] + p2[1]) / 2;
    const len = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
    const angle = Math.atan2(p2[1] - p1[1], p2[0] - p1[0]);
    walls.push(Bodies.rectangle(cx + wallThick * 0.4, cy, len + 2, wallThick, { ...innerWallOpts, angle }));
  }

  return walls;
}

const jarWalls = createJarWalls();
World.add(engine.world, jarWalls);

const giftBodies = [];
let totalGiftCount = 0;
let screenTrauma = 0;

// Combo tracker
let lastGiftKey = null;
let comboCount = 0;
let lastGiftTime = 0;
let comboTimer = null;

let jarSettings = {
  gravity: 0.95,
  giftScale: 0.85,
  bounciness: 0.4,
  maxGifts: 500,
  overflowAllowed: true
};

// Squash & Stretch Collision Listener
Events.on(engine, 'collisionStart', evt => {
  evt.pairs.forEach(pair => {
    const { bodyA, bodyB } = pair;
    const relVx = bodyA.velocity.x - bodyB.velocity.x;
    const relVy = bodyA.velocity.y - bodyB.velocity.y;
    const speed = Math.hypot(relVx, relVy);

    if (speed > 2.8) {
      if (bodyA.giftIcon) applySquash(bodyA, speed);
      if (bodyB.giftIcon) applySquash(bodyB, speed);
    }
  });
});

function applySquash(body, impactSpeed) {
  const intensity = Math.min(0.35, impactSpeed * 0.035);
  body.squashX = 1.0 + intensity;
  body.squashY = 1.0 - intensity;
}

function triggerCombo(giftName) {
  const now = Date.now();
  if (lastGiftKey === giftName && (now - lastGiftTime < 3200)) {
    comboCount++;
  } else {
    lastGiftKey = giftName;
    comboCount = 1;
  }
  lastGiftTime = now;

  if (comboCount >= 2) {
    comboBadge.textContent = `${giftName} x${comboCount}!`;
    comboBadge.classList.remove('show');
    void comboBadge.offsetWidth;
    comboBadge.classList.add('show');

    clearTimeout(comboTimer);
    comboTimer = setTimeout(() => {
      comboBadge.classList.remove('show');
    }, 2800);
  }
}

function dropGift(type, sizeMul = 1.0, directImg = null, giftName = 'Gift', coinVal = 1) {
  const baseRadius = 26 * jarSettings.giftScale * sizeMul;
  const radius = Math.max(18, Math.min(68, baseRadius));

  const spawnX = 260 + Math.random() * 244;
  const spawnY = -25 - Math.random() * 60;

  const giftBody = Bodies.circle(spawnX, spawnY, radius, {
    restitution: jarSettings.bounciness,
    friction: 0.35,
    frictionAir: 0.008,
    density: 0.002
  });

  Body.setVelocity(giftBody, {
    x: (Math.random() - 0.5) * 4.5,
    y: 2 + Math.random() * 4
  });
  Body.setAngularVelocity(giftBody, (Math.random() - 0.5) * 0.18);

  giftBody.giftIcon = type;
  giftBody.giftName = giftName;
  giftBody.coins = coinVal;
  giftBody.radius = radius;
  giftBody.giftImg = directImg || preloadedImgs[type] || getGiftImage(type, null, giftName);
  giftBody.alpha = 1.0;
  giftBody.createdAt = Date.now();
  giftBody.squashX = 1.0;
  giftBody.squashY = 1.0;

  giftBodies.push(giftBody);
  World.add(engine.world, giftBody);

  totalGiftCount++;

  // Enforce Max Gifts limit
  if (giftBodies.length > jarSettings.maxGifts) {
    const oldest = giftBodies.shift();
    World.remove(engine.world, oldest);
  }
}

function triggerScreenShake(intensity = 0.85) {
  screenTrauma = Math.max(screenTrauma, intensity);
}

function clearJar() {
  giftBodies.forEach(b => World.remove(engine.world, b));
  giftBodies.length = 0;
  totalGiftCount = 0;
  topGiftRecord = { sender: '', giftName: '', coins: 0, count: 0, totalValue: 0 };
  if (topSenderEl) topSenderEl.textContent = 'None yet';
  if (topDetailEl) topDetailEl.textContent = '0 coins';
  if (counterEl) counterEl.classList.remove('visible', 'counter-pop');
  comboBadge.classList.remove('show');
}

// Render loop with squash/stretch & screen shake
function render() {
  Engine.update(engine, 1000 / 60);
  ctx.clearRect(0, 0, W, H);

  // Screen shake calculation
  if (screenTrauma > 0.02) {
    const t = Date.now() * 0.045;
    const shakeX = Math.sin(t) * screenTrauma * 16;
    const shakeY = Math.cos(t * 0.9) * screenTrauma * 12;
    jarStage.style.transform = `translate3d(${shakeX.toFixed(2)}px, ${shakeY.toFixed(2)}px, 0)`;
    screenTrauma *= 0.93;
  } else if (screenTrauma > 0) {
    screenTrauma = 0;
    jarStage.style.transform = '';
  }

  // Render gift bodies
  for (let i = giftBodies.length - 1; i >= 0; i--) {
    const b = giftBodies[i];

    if (b.position.y > H + 160) {
      World.remove(engine.world, b);
      giftBodies.splice(i, 1);
      continue;
    }

    // Smooth squash spring return to 1.0
    b.squashX += (1.0 - b.squashX) * 0.16;
    b.squashY += (1.0 - b.squashY) * 0.16;

    const { x, y } = b.position;
    const r = b.radius;
    const img = b.giftImg || preloadedImgs[b.giftIcon] || getGiftImage(b.giftIcon, null, b.giftName);

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(b.angle);
    ctx.scale(b.squashX, b.squashY);
    ctx.globalAlpha = b.alpha || 1.0;

    // Gift graphic without circular border disc artifact
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, -r, -r, r * 2, r * 2);
    } else {
      drawGiftFallbackBadge(ctx, b, r);
    }
    ctx.restore();
  }

  requestAnimationFrame(render);
}

function drawGiftFallbackBadge(ctx, b, r) {
  const coins = b.coins || 1;
  const name = (b.giftName || b.giftIcon || 'Gift').toUpperCase();

  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);

  const grad = ctx.createRadialGradient(0, -r * 0.3, r * 0.2, 0, 0, r);
  if (coins >= 10000) {
    grad.addColorStop(0, '#ffe57f');
    grad.addColorStop(0.6, '#ffd54f');
    grad.addColorStop(1, '#ff8f00');
  } else if (coins >= 1000) {
    grad.addColorStop(0, '#f48fb1');
    grad.addColorStop(0.6, '#ba68c8');
    grad.addColorStop(1, '#7b1fa2');
  } else if (coins >= 100) {
    grad.addColorStop(0, '#80deea');
    grad.addColorStop(0.7, '#26a69a');
    grad.addColorStop(1, '#00695c');
  } else {
    grad.addColorStop(0, '#e1bee7');
    grad.addColorStop(0.7, '#ab47bc');
    grad.addColorStop(1, '#6a1b9a');
  }
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.lineWidth = Math.max(2, r * 0.08);
  ctx.strokeStyle = coins >= 1000 ? '#fff8e1' : 'rgba(255, 255, 255, 0.85)';
  ctx.stroke();

  let text = name;
  if (name.includes('UNIVERSE')) text = 'UNIV';
  else if (name.includes('LION')) text = 'LION';
  else if (name.includes('MONEY')) text = 'CASH';
  else if (name.includes('GALAXY')) text = 'GLXY';
  else if (name.includes('DRAGON')) text = 'DRAG';
  else if (name.includes('WHALE')) text = 'WHAL';
  else if (name.length > 5) {
    const words = name.split(/\s+/);
    text = words.length > 1 ? (words[0][0] + words[1][0]) : name.slice(0, 4);
  }

  ctx.fillStyle = coins >= 10000 ? '#3e2723' : '#ffffff';
  ctx.font = `bold ${Math.floor(r * 0.44)}px system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 0, 1);
}

requestAnimationFrame(render);

// WebSocket integration
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${proto}//${location.host}`);

  ws.onmessage = evt => {
    try {
      const data = JSON.parse(evt.data);
      if (data.type === 'init' && data.settings?.jar) {
        jarSettings = Object.assign(jarSettings, data.settings.jar);
        engine.gravity.y = jarSettings.gravity;
      } else if (data.type === 'settings:update' && data.settings?.jar) {
        jarSettings = Object.assign(jarSettings, data.settings.jar);
        engine.gravity.y = jarSettings.gravity;
      } else if (data.type === 'gift') {
        const giftName = data.giftName || 'Gift';
        const giftKey = (data.giftId || data.giftName || 'rose').toLowerCase().replace(/\s+/g, '_');
        const resolvedUrl = data.giftPictureUrl || resolveGiftUrl(giftKey, null, giftName);

        let dynamicImg = null;
        if (resolvedUrl) {
          if (!preloadedImgs[giftKey]) {
            dynamicImg = new Image();
            dynamicImg.src = resolvedUrl;
            preloadedImgs[giftKey] = dynamicImg;
          } else {
            dynamicImg = preloadedImgs[giftKey];
          }
        }

        const count = Math.min(25, Math.max(1, data.count || 1));
        const coinVal = data.coins || data.diamonds || 1;
        let sizeMul = 1.0;
        if (coinVal >= 10000) sizeMul = 1.75;
        else if (coinVal >= 1000) sizeMul = 1.45;
        else if (coinVal >= 100) sizeMul = 1.25;
        else if (coinVal >= 10) sizeMul = 1.12;

        // Record and display Biggest Gift Spotlight
        const sender = data.nickname || data.uniqueId || data.user || 'Viewer';
        recordTopGift(sender, giftName, coinVal, count);

        // Trigger combo badge
        triggerCombo(giftName);

        // Tier 4 screen shake
        if (coinVal >= 1000) {
          triggerScreenShake(coinVal >= 10000 ? 1.0 : 0.7);
        }

        for (let i = 0; i < count; i++) {
          setTimeout(() => dropGift(giftKey, sizeMul, dynamicImg, giftName, coinVal), i * 85);
        }
      } else if (data.type === 'clearJar') {
        clearJar();
      }
    } catch (e) {
      console.warn('WS message error', e);
    }
  };

  ws.onclose = () => setTimeout(connectWS, 2000);
  ws.onerror = () => ws.close();
}

connectWS();

// Click to drop test gift in standalone browser view
canvas.addEventListener('pointerdown', () => {
  const gifts = Object.keys(GIFT_ICONS);
  const rand = gifts[Math.floor(Math.random() * gifts.length)];
  const randomCoins = Math.floor(Math.random() * 500 + 1);
  const testSenders = ['Sakura', 'MochiCat', 'PixelStar', 'BobaQueen', 'CloudySky'];
  const randSender = testSenders[Math.floor(Math.random() * testSenders.length)];
  dropGift(rand, 1.0, null, rand.replace(/_/g, ' '), randomCoins);
  recordTopGift(randSender, rand.replace(/_/g, ' '), randomCoins, 1);
  triggerCombo(rand.replace(/_/g, ' '));
});
</script>
</body>
</html>
